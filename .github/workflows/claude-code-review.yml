name: Claude Code Review

# Reviews pull requests into main.
#
# Why not the code-review plugin (used until 2026-10-02): its command runs every step through subagents ("launch a haiku
# agent ..."), and this job's tool list allows no agent tool, so the run ended after a single reply without reading the PR
# and the check still went green (PR #6: 2 turns, no tool call, no comment). This job uses a direct review prompt with the
# gh tools instead, the pattern of the action's own example (examples/pr-review-comprehensive.yml in
# anthropics/claude-code-action), and it fails when no review comment was posted, so a silent no-op cannot pass again.
#
# Note: the action only runs a workflow file that is identical to the one on the default branch, so on the pull request
# that changes this file the check fails; it applies from the next pull request after the merge.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]

# One review per pull request at a time, so a run never counts another run's comments.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # bash with pipefail: a failed gh api call fails the step instead of counting as 0 comments.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Bot comments, inline review comments and reviews on the PR before the review runs.
      - name: Count bot comments before the review
        id: before
        run: |
          n=0
          for ep in "issues/$PR/comments" "pulls/$PR/comments" "pulls/$PR/reviews"; do
            c=$(gh api --paginate "repos/$GITHUB_REPOSITORY/$ep" --jq '[.[] | select(.user.type == "Bot")] | length' | awk '{s += $1} END {print s + 0}')
            n=$((n + c))
          done
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read it with `gh pr view` and `gh pr diff`; the project rules are in CLAUDE.md in the
            checkout (and in any CLAUDE.md in a directory the pull request touches).

            Report only high-signal issues: code that will not compile, type-check or run; logic that is wrong for every
            input; security problems; tests that cannot pass or no longer test what they claim; and clear violations of a
            CLAUDE.md rule you can quote. Skip style, naming and subjective suggestions. If you are not sure an issue is real,
            leave it out.

            Put each issue as an inline comment on the line it concerns (mcp__github_inline_comment__create_inline_comment).
            Always finish with exactly one top-level summary comment via `gh pr comment`: list the issues you found, or say
            that you found none and what you checked. This job fails when no comment is posted.
          claude_args: '--allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'

      # A run that posted nothing reviewed nothing: fail instead of passing silently.
      - name: Fail if no review was posted
        run: |
          n=0
          for ep in "issues/$PR/comments" "pulls/$PR/comments" "pulls/$PR/reviews"; do
            c=$(gh api --paginate "repos/$GITHUB_REPOSITORY/$ep" --jq '[.[] | select(.user.type == "Bot")] | length' | awk '{s += $1} END {print s + 0}')
            n=$((n + c))
          done
          echo "bot comments before: ${{ steps.before.outputs.count }}, after: $n"
          if [ "$n" -le "${{ steps.before.outputs.count }}" ]; then
            echo "::error::Claude Code Review posted no comment on PR #$PR, so nothing was reviewed."
            exit 1
          fi
